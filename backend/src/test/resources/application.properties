spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

spring.data.redis.repositories.enabled=false
spring.mail.host=localhost
spring.mail.port=2525
app.jwt.secret=test_secret_key_for_phase_one_backend_123456789
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000
app.oauth2.redirect-uri=http://localhost:5173/oauth/success
app.google-oauth.client-id=
app.google-oauth.client-secret=
app.rate-limit.requests-per-minute=10
